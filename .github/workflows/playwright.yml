name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'      # безопаснее, если нет причин брать 25
          cache: 'maven'          # кэш ~/.m2

      - name: Build & Install
        run: mvn -B install -DskipTests --no-transfer-progress

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      - name: Ensure browsers are installed
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Create .env from secrets
        run: |
          printf 'APP_USERNAME=%s\n' '${{ secrets.APP_USERNAME }}' > .env
          printf 'APP_PASSWORD=%s\n' '${{ secrets.APP_PASSWORD }}' >> .env
      - name: Check app availability

        run: curl -I --connect-timeout 15 http://2.27.33.116/login || echo "UNREACHABLE"

      - name: Authenticate (build storage state)
        run: mvn test -Dtest=AuthSetupMyTest

      - name: Run tests
        run: mvn test -Dtest='!AuthSetupMyTest'   # не гоняем логин повторно

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore